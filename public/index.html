<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SOMA — Kibaha Learning Progress</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png">
<meta name="theme-color" content="#354062">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOMA">
<style>
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --surface-2:#EEF1F6; --border:#F0F0F0;
  --ink:#354062; --ink-dim:#5A6478; --ink-faint:#9AA4B8;
  --brand:#354062; --brand-dark:#2A3350; --on-brand:#FFFFFF;
  --teal:#5EA6B8; --gold:#FFC650; --terracotta:#BE6243; --on-accent:#354062;
  --flag-high-bg:#FBEFEC; --flag-high-ink:#8A3F2B;
  --flag-med-bg:#FFF9EE; --flag-med-ink:#8A6D1F;
  --rec-bg:#EDF4F6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181F; --surface:#1D222C; --surface-2:#262C38; --border:#323A4A;
    --ink:#E9ECF3; --ink-dim:#AEB6C7; --ink-faint:#7E8699;
    --brand:#354062; --brand-dark:#232B42; --on-brand:#FFFFFF;
    --teal:#6FC2D6; --gold:#FFC650; --terracotta:#E08468; --on-accent:#22262F;
    --flag-high-bg:#3A2420; --flag-high-ink:#E8B3A3;
    --flag-med-bg:#3A3220; --flag-med-ink:#E8CE9B;
    --rec-bg:#1F2E35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181F; --surface:#1D222C; --surface-2:#262C38; --border:#323A4A;
  --ink:#E9ECF3; --ink-dim:#AEB6C7; --ink-faint:#7E8699;
  --brand:#354062; --brand-dark:#232B42; --on-brand:#FFFFFF;
  --teal:#6FC2D6; --gold:#FFC650; --terracotta:#E08468; --on-accent:#22262F;
  --flag-high-bg:#3A2420; --flag-high-ink:#E8B3A3;
  --flag-med-bg:#3A3220; --flag-med-ink:#E8CE9B;
  --rec-bg:#1F2E35;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--teal)}a:hover{color:var(--ink)}

/* ---------- Shell: mobile-first, desktop via sidebar at wide viewports ---------- */
.shell{display:flex;min-height:100vh}
.side{display:none}
.mainwrap{flex:1;min-width:0}

.hdr{background:var(--brand);color:var(--on-brand);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;-webkit-user-select:none;user-select:none}
.hdr-t{font-size:16px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.hdr-t img{display:block}
.hdr-s{font-size:10px;opacity:.65;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:2px;flex-shrink:0}
.lang-btn{border:none;background:transparent;color:rgba(255,255,255,.6);font-size:11px;font-weight:700;padding:5px 10px;border-radius:18px;cursor:pointer}
.theme-btn{border:none;background:rgba(255,255,255,.12);color:#fff;font-size:12px;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.side .theme-btn{background:rgba(255,255,255,.1);margin-left:2px}
.lang-btn.on{background:var(--gold);color:var(--on-accent)}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;white-space:nowrap;flex-shrink:0}
.badge.live{background:var(--teal);color:var(--on-brand)}
.badge.team{background:var(--terracotta);color:var(--on-brand);cursor:pointer}

.tabs{background:var(--brand-dark);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5}
.tab{flex-shrink:0;padding:12px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.tab[hidden]{display:none}

.panel{max-width:600px;margin:0 auto;padding:14px}
.panel[hidden]{display:none}
.year-picker-wrap{max-width:600px;margin:0 auto;padding:10px 14px 0}
.year-picker-wrap:empty,.year-picker-wrap .gpills:empty{display:none}

.intro-line{font-size:12px;color:var(--ink-dim);line-height:1.6;background:var(--surface);border-radius:10px;padding:13px 15px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.journey-note{font-size:10.5px;color:var(--ink-faint);line-height:1.5;margin-bottom:10px}
.intro-line b{color:var(--ink)}

.kg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:480px){.kg{grid-template-columns:repeat(4,1fr)}}
.kc{background:var(--surface);border-radius:10px;padding:13px 12px;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}
.kv{font-size:25px;font-weight:800;color:var(--ink);line-height:1.1;margin:3px 0 2px}
.ks{font-size:10px;color:var(--ink-faint)}

.card{background:var(--surface);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.10);margin-bottom:14px}
.ct{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.ct-sub{font-weight:400;text-transform:none;font-size:10px;color:var(--ink-faint)}

.gpills{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.gpill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:14px;background:var(--surface-2);color:var(--ink-faint);cursor:pointer;border:none}
.gpill.on{background:var(--brand);color:var(--on-brand)}

.subj-label{font-size:11px;font-weight:700;color:var(--ink-dim);margin-bottom:8px;margin-top:16px}
.subj-label:first-child{margin-top:0}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 10px;gap:16px}
/* An explicit `display` on .loading-wrap otherwise always beats the
   browser's own [hidden]{display:none} rule (author CSS overrides the UA
   stylesheet regardless of source order), so setting `.hidden = true` in
   JS silently had no visual effect and the spinner ran forever. */
#page-loading[hidden]{display:none}
.spinner{width:36px;height:36px;border:4px solid var(--surface-2);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12.5px;color:var(--ink-faint);font-weight:600}
.loading-bar{width:180px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.loading-bar-fill{height:100%;width:40%;background:var(--teal);border-radius:3px;animation:loadbar 1.1s ease-in-out infinite}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ---------- Journey path (replaces the old stacked-percentage bar) ---------- */
.journey{display:flex;align-items:flex-start;position:relative;padding:6px 2px 2px}
.journey::before{content:'';position:absolute;top:29px;left:24px;right:24px;height:3px;background:var(--border);z-index:0}
.jstop{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1;min-width:0}
.jdot{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;margin-bottom:0;border:3px solid var(--bg);line-height:1;letter-spacing:-.2px}
.jpct{font-size:15px;font-weight:800;color:var(--ink)}
.jname{font-size:8.5px;font-weight:700;letter-spacing:.3px;color:var(--ink-faint);margin-top:8px;line-height:1.3;text-transform:uppercase}
.jskill{font-size:11px;font-weight:400;color:var(--ink);margin-top:3px;line-height:1.3;padding:0 2px}
.jstop.outlier{flex:0 0 auto;width:64px;margin-left:6px}
.jstop.outlier .jdot{width:44px;height:44px;font-size:11px}
.skillrow-desc{font-weight:700;color:var(--ink);font-size:11.5px;line-height:1.3}
.skillrow-name{font-size:8.5px;font-weight:700;letter-spacing:.3px;color:var(--ink-faint);text-transform:uppercase;margin-top:2px}

.empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:20px 8px}
.access-line{font-size:11px;color:var(--ink-faint);margin-bottom:16px;padding-left:2px}
.access-line b{color:var(--ink-dim);font-weight:600}

.school-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.school-row-wrap:last-child .school-snapshot{border-bottom:none}
.school-snapshot{padding:10px 2px 18px;border-bottom:1px solid var(--border)}
.snap-grade-block{margin-bottom:18px}
.snap-grade-block:last-child{margin-bottom:0}
.snap-grade-hdr{font-size:12.5px;font-weight:800;color:var(--ink);background:var(--surface-2);padding:5px 9px;border-radius:7px;display:inline-block;margin-bottom:6px}
.snap-section-label{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-faint);margin:14px 0 6px;padding-top:10px;border-top:1px dashed var(--border)}
.snap-section-label:first-of-type{border-top:none;padding-top:0}
.snap-action-group{margin-bottom:8px;font-size:11px}
.snap-action-group b{font-size:9.5px;letter-spacing:.3px;color:var(--ink)}
.snap-action-count{font-size:9.5px;color:var(--ink-faint);font-weight:600}
.snap-action-group ul{margin:3px 0 0 16px;padding:0;color:var(--ink-dim);line-height:1.5}
.snap-movement-row{display:flex;gap:14px;font-size:12px;font-weight:700;padding:3px 0 2px}
.snap-movement-row .up{color:var(--teal)}
.snap-movement-row .same{color:var(--ink-faint)}
.snap-movement-row .down{color:var(--terracotta)}
.rec-cat{padding:10px 0;border-bottom:1px solid var(--border)}
.rec-cat:last-child{border-bottom:none}
.rec-cat-title{font-size:11.5px;font-weight:800;color:var(--ink);margin-bottom:6px}
.rec-row{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px}
.rec-rank{width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--on-accent);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-school{flex:1;font-weight:600;color:var(--ink)}
.rec-metric{font-weight:800;color:var(--teal)}
.school-row:last-child{border-bottom:none}
.school-name{font-size:12px;font-weight:700;color:var(--ink);flex:1;min-width:0}
.school-ward{font-size:9px;color:var(--ink-faint);font-weight:400}
.mini-bar{width:80px;height:8px;border-radius:4px;overflow:hidden;display:flex;flex-shrink:0;background:var(--surface-2)}

.rise-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.rise-item:last-child{margin-bottom:0;border-bottom:none}
.rise-rank{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.rise-rank.gold{background:var(--gold);color:var(--on-accent)}
.rise-gain{margin-left:auto;text-align:right}
.rise-gain-v{font-size:15px;font-weight:800;color:var(--teal)}
.rise-gain-l{font-size:9px;color:var(--ink-faint)}

.trend-row{display:flex;align-items:flex-end;gap:14px;height:120px;padding:0 4px}
.trend-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.trend-bar{width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--surface-2);min-height:2px}
.trend-lbl{font-size:9px;color:var(--ink-faint);font-weight:600}
.trend-val{font-size:10px;color:var(--ink);font-weight:700}

.flag-item{border-left:3px solid var(--terracotta);background:var(--flag-high-bg);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:8px}
.flag-item.med{border-left-color:var(--gold);background:var(--flag-med-bg)}
.flag-item:last-child{margin-bottom:0}
.flag-sev{display:inline-block;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;background:var(--terracotta);color:#fff;margin-bottom:5px;text-transform:uppercase}
.flag-item.med .flag-sev{background:var(--gold);color:var(--on-accent)}
.flag-msg{font-size:11.5px;color:var(--flag-high-ink);line-height:1.45}
.flag-item.med .flag-msg{color:var(--flag-med-ink)}

.tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.tbl th{background:var(--brand);color:var(--on-brand);padding:7px 8px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.3px}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--ink-dim)}
.tbl-wrap{overflow-x:auto;border-radius:0 0 8px 8px;margin:0 -16px -16px;padding:0 16px 4px}

/* Data Quality tab: search/filter + drill-down detail shared by the
   enumerator/school/ward sections. Reuses .school-row/.school-snapshot/
   .snap-section-label from the Find-Your-School card for visual
   consistency rather than inventing a parallel set of card styles. */
.dq-search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--surface);color:var(--ink);margin-bottom:10px;box-sizing:border-box}
.dq-search::placeholder{color:var(--ink-faint)}
.dq-row-flagct{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:9px;background:var(--flag-high-bg);color:var(--flag-high-ink);flex-shrink:0;white-space:nowrap}
.dq-timeline{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;height:70px;padding-bottom:2px}
.dq-tbar{flex-shrink:0;width:9px;border-radius:2px 2px 0 0;background:var(--teal);min-height:2px}
.dq-spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin:2px 0}
.dq-spark div{width:5px;border-radius:1px;background:var(--teal);min-height:2px;flex-shrink:0}
.dq-mini-list{font-size:11px;color:var(--ink-dim);line-height:1.65}
.dq-mini-row{display:flex;justify-content:space-between;gap:10px}
.dq-mini-row span:last-child{font-weight:700;color:var(--ink);flex-shrink:0}

.ins-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.ins-headline{font-size:15px;font-weight:800;color:var(--ink);line-height:1.4;margin-bottom:4px}
.ins-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);margin:16px 0 8px}
.ins-bullet{display:flex;gap:8px;margin-bottom:8px;font-size:12.5px;color:var(--ink-dim);line-height:1.55}
.ins-rec{background:var(--rec-bg);border-radius:8px;padding:11px 13px;margin-top:10px}
.ins-rec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--teal);margin-bottom:5px}
.ins-btn{background:var(--brand);color:var(--on-brand);border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer}
.ins-btn:disabled{opacity:.5}

.report-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.report-btn{background:var(--surface);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 14px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.report-btn:hover{border-color:var(--teal)}

.foot{font-size:10px;color:var(--ink-faint);text-align:center;padding:10px 0 26px}
.foot-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.foot-wrap img{display:block;opacity:.85}
.foot-wrap .foot{padding:0 0 26px}
.by-li{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;color:var(--ink-faint)}
.by-li img{display:block}

#lock-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#lock-overlay[hidden]{display:none}
.lock-box{background:var(--surface);border-radius:12px;padding:24px;max-width:320px;width:100%;text-align:center}
.lock-box h3{font-size:15px;margin-bottom:6px;color:var(--ink)}
.lock-box p{font-size:11px;color:var(--ink-faint);margin-bottom:14px}
.lock-box input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;text-align:center;margin-bottom:10px;background:var(--surface);color:var(--ink)}
.lock-box button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;cursor:pointer}
.lock-err{font-size:11px;color:var(--terracotta);margin-top:8px;min-height:14px}

/* ---------- Desktop layout ---------- */
@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:230px;flex-shrink:0;background:var(--brand);padding:22px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{padding:0 22px 18px;color:#fff}
  .side-brand .t{font-size:20px;font-weight:800}
  .side-brand .s{font-size:10px;opacity:.6;margin-top:3px}
  .side-lang{display:flex;gap:4px;padding:0 22px 18px}
  .side .lang-btn{flex:1;padding:6px;font-size:10px}
  .side-nav{padding:0 10px}
  .side-item{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:13px;font-weight:600;color:rgba(255,255,255,.6);border-radius:8px;cursor:pointer;margin-bottom:2px}
  .side-item.on{color:#FFC650;background:rgba(255,255,255,.06)}
  .side-item[hidden]{display:none}
  .side-lock{margin-top:auto;padding:14px 22px 0}
  .hdr{display:none}
  .tabs{display:none}
  .mainwrap{max-width:none}
  .panel{max-width:1100px;padding:28px}
  .year-picker-wrap{max-width:1100px;padding:16px 28px 0}
  .kg{grid-template-columns:repeat(4,1fr)}
  .two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start}
  .two-col .card{margin-bottom:18px}
}
</style>
</head>
<body>

<div class="shell">
  <div class="side">
    <div class="side-brand">
      <div class="t">SOMA</div>
      <div class="s" data-t="hdr_sub">Maendeleo ya Kujifunza — Kibaha</div>
      <div class="by-li"><img src="/learnimpact-mark-white.png" alt="LearnImpact" height="14"><span>LearnImpact</span></div>
    </div>
    <div class="side-lang">
      <button class="lang-btn" data-lang="sw">SW</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="theme-btn" id="theme-btn-side" onclick="toggleTheme()">🌙</button>
    </div>
    <div class="side-nav" id="side-nav"></div>
    <div class="side-lock"><span class="badge team" id="team-badge-side">🔒 Team</span></div>
  </div>

  <div class="mainwrap">
    <div class="hdr" id="hdr-tap-zone">
      <div>
        <div class="hdr-t"><img src="/learnimpact-mark-white.png" alt="" height="18">SOMA</div>
        <div class="hdr-s" data-t="hdr_sub">Maendeleo ya Kujifunza — Kibaha</div>
      </div>
      <div class="hdr-right">
        <div class="lang-toggle">
          <button class="lang-btn" data-lang="sw">SW</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        <span class="badge live" id="status-badge">…</span>
      </div>
    </div>

    <div class="tabs" id="tabbar"></div>
    <div class="year-picker-wrap" id="year-picker-wrap">
      <div class="gpills" id="year-picker" style="margin-bottom:0"></div>
    </div>

    <div class="loading-wrap" id="page-loading">
      <div class="spinner"></div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div class="loading-txt" data-t="page_loading"></div>
    </div>

    <div class="panel on" data-panel="overview">
      <div class="intro-line" data-t="statement_line"></div>
      <div class="kg" id="ov-kpis"></div>

      <div class="card">
        <div class="ct"><span data-t="ct_find_school"></span></div>
        <div class="intro-line" style="margin:0 0 12px;font-size:10.5px" data-t="find_school_tap_hint"></div>
        <div id="find-school"></div>
      </div>

      <div class="card">
        <div class="ct"><span data-t="ct_recognition"></span></div>
        <div id="recognition"></div>
      </div>

      <div class="card leaders-card">
        <div class="ct"><span data-t="ct_leaders"></span></div>

let LANG = localStorage.getItem('soma_lang') || 'sw';

// Theme: 'auto' (default) follows the OS via the CSS `prefers-color-scheme`
// rules alone — no JS needed for that case, so there's no flash on first
// load. JS only runs to apply/persist an explicit user override.
let THEME = localStorage.getItem('soma_theme') || 'auto';
function applyTheme() {
  if (THEME === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = THEME;
  const icon = THEME === 'dark' ? '☀️' : '🌙';
  const btn1 = document.getElementById('theme-btn'); if (btn1) btn1.textContent = icon;
  const btn2 = document.getElementById('theme-btn-side'); if (btn2) btn2.textContent = icon;
}
function toggleTheme() {
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const effective = THEME === 'auto' ? (systemDark ? 'dark' : 'light') : THEME;
  THEME = effective === 'dark' ? 'light' : 'dark';
  localStorage.setItem('soma_theme', THEME);
  applyTheme();
}
applyTheme();
function t(key) { return (T[LANG] && T[LANG][key]) || (T.sw[key] || key); }
// Handles both the new {sw,en} bilingual shape and plain strings — older
// cached insights (generated before bilingual support existed) are plain
// strings; they still display, just not translated, until regenerated.
function bi(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[LANG] || obj.sw || obj.en || '';
}

const GROUP_NAMES = {
  sw: ['Wanaoanza', 'Wanaochipukia', 'Wanaoendelea', 'Waliofikia Kiwango'],

};

  en: ['not yet recognizing numbers', 'recognizing numbers', 'can add', 'can subtract'],

// Rounds are computed server-side from each submission's own date (see
// src/rounds.js) using the same three calendar windows for every year, and
// displayed as "Visit #N / Ziara #N" (prominent) with the M&E technical
// term (Baseline/Midline/Endline) shown small/faint below it. 2026, the
// programme's pilot/launch year, is a full census for every visit; from
// 2027 onward only Visit #1 (Baseline) is a census, #2/#3 are samples.
const ROUND_META = {
  pilot: { number: null, technical: { sw: 'Pilot', en: 'Pilot' }, shortTechnical: { sw: 'Pilot', en: 'Pilot' } },
  round1: { number: 1, technical: { sw: 'Msingi', en: 'Baseline' }, shortTechnical: { sw: 'MS', en: 'BL' } },
  round2: { number: 2, technical: { sw: 'Katikati', en: 'Midline' }, shortTechnical: { sw: 'KT', en: 'ML' } },
  round3: { number: 3, technical: { sw: 'Mwisho', en: 'Endline' }, shortTechnical: { sw: 'MW', en: 'EL' } },
};
function roundsForYear(year) {
  // Everything in 2026 is the Pilot — a single full-census snapshot. Normal
  // Visit #1/#2/#3 numbering starts in 2027 (confirmed by Michael 2026-09-25).
  return year === '2026' ? ['pilot'] : ['round1', 'round2', 'round3'];
}
function roundMethod(key) {
  return currentYear === '2026' ? 'census' : (key === 'round1' ? 'census' : 'sample');
}
function roundTop(key) {
  const m = ROUND_META[key];
  if (key === 'pilot') return m.technical[LANG];
  return LANG === 'sw' ? `Ziara #${m.number}` : `Visit #${m.number}`;
}
// The Baseline/Midline/Endline technical term only appears in English —
// in Swahili it caused real ambiguity/confusion (Michael's field feedback),
// so Swahili shows "Ziara #N" alone rather than a Msingi/Katikati/Mwisho
// subtitle underneath it.
function roundLabelHtml(key) {
  const m = ROUND_META[key];
  if (LANG !== 'en' || key === 'pilot') return `<span style="font-weight:700">${roundTop(key)}</span>`;
  return `<span style="font-weight:700">${roundTop(key)}</span><br><span style="font-size:9px;color:#9aa4b8;font-weight:400">${m.technical.en}</span>`;
}
function roundLabelPlain(key) {
  const m = ROUND_META[key];
  return LANG === 'en' && key !== 'pilot' ? `${roundTop(key)} (${m.technical.en})` : roundTop(key);
}
// Compact single-line form for tight spaces, e.g. "Visit #1 - BL".
function roundLabelCompact(key) {
  const m = ROUND_META[key];
  return LANG === 'en' && key !== 'pilot' ? `${roundTop(key)} - ${m.shortTechnical.en}` : roundTop(key);
}
function methodBadge(key) {
  const m = roundMethod(key);
  const label = m === 'census' ? (LANG === 'sw' ? 'Sensa' : 'Census') : (LANG === 'sw' ? 'Sampuli' : 'Sample');
  return `<span style="font-size:8.5px;font-weight:700;background:#eef1f6;color:#7c869c;padding:1px 6px;border-radius:6px;margin-left:5px">${label}</span>`;
}

function pct(count, n) { return n > 0 ? Math.round((count / n) * 100) : 0; }

function yearData() { return DATA && currentYear ? DATA.by_year[currentYear] : null; }

// Latest round (in that year's sequence) that actually has data, falling
// back to the sequence's first round if nothing has data yet.
function bestAvailableRound(rounds, year) {
  const seq = roundsForYear(year);
  for (let i = seq.length - 1; i >= 0; i--) {
    if (rounds[seq[i]] && rounds[seq[i]].n > 0) return seq[i];
  }
  return seq[0];
}

function skillRow(name, skill, base, now, single) {
  if (base == null || now == null) return '';

  // Only one visit has data yet: showing it twice with a "0 change" column
  // reads as a comparison against itself, so show a single value instead.
  if (single) return `<tr>${label}<td class="num" style="text-align:right;font-weight:700">${now}%</td></tr>`;
  const delta = now - base;
  const arrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '—';
  const cls = delta > 0 ? 'up' : delta < 0 ? 'down' : '';
  return `<tr>${label}
    <td class="num" style="text-align:right">${base}%</td><td class="num" style="text-align:right;font-weight:700">${now}%</td>
    <td class="num" style="text-align:right"><span style="font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:8px;background:${cls === 'up' ? '#EDF4F6' : cls === 'down' ? '#F4F0EC' : '#f4f4f4'};color:${cls === 'up' ? '#2d6a7d' : '#8a8478'}">${arrow} ${Math.abs(delta)}</span></td></tr>`;
}

// Simple linear extrapolation: if baseline->midline gained N points, project
// midline->endline gains N more, clamped to [0,100]. Explicitly labeled as
// an estimate, not a forecast — deliberately not more sophisticated than
// that given how few rounds/how much small-sample noise exists this early
// (see the sampling-protocol precision-ceiling finding from earlier work).
function projectedRound3(rounds, field) {
  const b = rounds.round1, m = rounds.round2, e = rounds.round3;
  if (e && e.n) return null; // real Round 3 data exists, no need to project
  if (!b || !b.n || !m || !m.n) return null;
  const bp = pct(b[field][3], b.n), mp = pct(m[field][3], m.n);
  return Math.max(0, Math.min(100, mp + (mp - bp)));
}

function renderTrends() {
  const Y = yearData();
  const seq = currentYear ? roundsForYear(currentYear) : [];
  const hasAnyData = Y && seq.some(r => Y.rounds[r] && Y.rounds[r].n);
  // Msingi/Katikati/Mwisho is dropped in Swahili (ambiguous) — each bar
  // already carries its own "Ziara #N" label, so the subtitle is only
  // useful in English.
  const subtitle = LANG === 'en' && seq.length > 1 ? seq.map(r => ROUND_META[r].technical.en).join(' → ') : '';
  document.getElementById('trend-sub-r').textContent = subtitle;
  document.getElementById('trend-sub-a').textContent = subtitle;
  if (!hasAnyData) {
    const msg = `<div class="empty">${t('empty_no_data')}</div>`;
    document.getElementById('trend-reading').innerHTML = msg;
    document.getElementById('trend-arith').innerHTML = '';
    document.getElementById('trend-note').hidden = true;
    return;
  }
  const rounds = Y.rounds;
  const maxH = 90;
  function bars(field) {
    const vals = seq.map(r => rounds[r].n ? pct(rounds[r][field][3], rounds[r].n) : null);
    const projected = projectedRound3(rounds, field);
    const allVals = vals.filter(v => v != null).concat(projected != null ? [projected] : []);
    const max = Math.max(...allVals, 1);
    let html = seq.map((r, i) => {
      const v = vals[i];
      const h = v == null ? 4 : Math.max(4, (v / max) * maxH);
      return `<div class="trend-bar-wrap"><div class="trend-val">${v == null ? '—' : v + '%'}</div>
        <div class="trend-bar" style="height:${h}px;background:${v == null ? '#e8ecf3' : '#5EA6B8'}"></div>
        <div class="trend-lbl">${roundTop(r)}</div></div>`;
    }).join('');
    if (projected != null) {
      const h = Math.max(4, (projected / max) * maxH);
      html += `<div class="trend-bar-wrap"><div class="trend-val">~${Math.round(projected)}%</div>
        <div class="trend-bar" style="height:${h}px;background:repeating-linear-gradient(45deg,#FFC650,#FFC650 4px,#fff3d6 4px,#fff3d6 8px);border:1px dashed #d9a53d"></div>
        <div class="trend-lbl">${t('ct_projection')}</div></div>`;
    }
    return html;
  }
  document.getElementById('trend-reading').innerHTML = bars('reading');
  document.getElementById('trend-arith').innerHTML = bars('arithmetic');
  const hasProjection = projectedRound3(rounds, 'reading') != null || projectedRound3(rounds, 'arithmetic') != null;
  document.getElementById('trend-note').hidden = !hasProjection;
}

function renderSchools() {
  const Y = yearData();
  if (!Y) {
    document.getElementById('school-compare').innerHTML = `<div class="empty">${t('empty_no_schools')}</div>`;
    document.getElementById('rising-fast').innerHTML = '';
    return;
  }
  const round = bestAvailableRound(Y.rounds, currentYear);
  document.getElementById('sc-round-lbl').innerHTML = roundLabelHtml(round);
  const rows = Object.entries(Y.schools).map(([id, s]) => {
    let n = 0, correct = 0;
    Object.values(s.grades).forEach(g => { if (g[round]) { n += g[round].n; correct += g[round].reading[3]; } });
    return { id, name: s.name, ward: s.ward, pct: pct(correct, n), n };
  }).filter(s => s.n > 0).sort((a, b) => b.pct - a.pct);

  document.getElementById('school-compare').innerHTML = rows.length ? rows.map(s => `
    <div class="school-row">
      <div class="school-name">${s.name}<div class="school-ward">${s.ward || ''}</div></div>
      <div class="mini-bar"><div style="width:${s.pct}%;background:#354062"></div></div>
      <div style="font-size:12px;font-weight:800;color:#354062;width:34px;text-align:right">${s.pct}%</div>
      <button class="report-btn" style="padding:5px 9px;font-size:10px" onclick="openReport('school','${s.id}')">📄</button>
    </div>`).join('') : `<div class="empty">${t('empty_no_schools')}</div>`;

  const [gainRoundA, gainRoundB] = roundsForYear(currentYear);
  document.getElementById('ct-rising-sub').textContent = gainRoundB ? `${t('ct_rising_sub_prefix')} ${roundTop(gainRoundA)} → ${roundTop(gainRoundB)}` : '';
  const gains = !gainRoundB ? [] : Object.entries(Y.schools).map(([id, s]) => {
    let bn = 0, bc = 0, mn = 0, mc = 0;
    Object.values(s.grades).forEach(g => {
      if (g[gainRoundA]) { bn += g[gainRoundA].n; bc += g[gainRoundA].reading[3]; }
      if (g[gainRoundB]) { mn += g[gainRoundB].n; mc += g[gainRoundB].reading[3]; }
    });
    if (!bn || !mn) return null;
    return { name: s.name, ward: s.ward, gain: pct(mc, mn) - pct(bc, bn) };
  }).filter(Boolean).sort((a, b) => b.gain - a.gain).slice(0, 3);

  document.getElementById('rising-fast').innerHTML = gains.length ? gains.map((s, i) => `
    <div class="rise-item">
      <div class="rise-rank ${i === 0 ? 'gold' : ''}">${i + 1}</div>
      <div style="flex:1"><div style="font-size:12.5px;font-weight:700;color:#354062">${s.name}<span style="font-size:9.5px;color:#b7bfd0;font-weight:400"> · ${s.ward || ''}</span></div></div>
      <div class="rise-gain"><div class="rise-gain-v">${s.gain >= 0 ? '+' : ''}${s.gain}</div><div class="rise-gain-l">pts</div></div>
    </div>`).join('') : `<div class="empty">${t('empty_rising')}</div>`;
}

function renderProgramme() {
  const Y = yearData();
  if (!Y) {
    document.getElementById('round-progress').innerHTML = `<div class="empty">${t('empty_no_data')}</div>`;
    document.getElementById('school-grade-tbl').innerHTML = '';
    return;
  }
  const seq = roundsForYear(currentYear);
  const target = Math.max(1, ...seq.map(r => Y.rounds[r].n));
  document.getElementById('round-progress').innerHTML = seq.map(r => {
    const n = Y.rounds[r].n;
    const h = Math.max(4, (n / target) * 90);
    return `<div class="trend-bar-wrap"><div class="trend-val">${n}</div>
      <div class="trend-bar" style="height:${h}px;background:${n ? '#354062' : '#e8ecf3'}"></div>
      <div class="trend-lbl">${roundTop(r)}</div></div>`;
  }).join('');

  const rows = [];
  Object.entries(Y.schools).forEach(([id, s]) => {
    Object.entries(s.grades).forEach(([g, rs]) => {
      const round = bestAvailableRound(rs, currentYear);
      if (!rs[round].n) return;
      rows.push(`<tr><td>${s.name}</td><td>${t('lbl_grade')} ${g}</td><td>${rs[round].n}</td><td>${pct(rs[round].reading[3], rs[round].n)}%</td><td>${pct(rs[round].arithmetic[3], rs[round].n)}%</td></tr>`);
    });
  });
  document.getElementById('school-grade-tbl').innerHTML =
    `<tr><th>${t('lbl_school')}</th><th>${t('lbl_grade')}</th><th>n</th><th>${t('lbl_reading')}</th><th>${t('lbl_arithmetic')}</th></tr>` +
    (rows.join('') || `<tr><td colspan="5" style="text-align:center;color:#9aa4b8;padding:14px">${t('empty_no_data_row')}</td></tr>`);
}

/* ============================== Data Quality tab ==============================
   Built for the internal team's HR/logistics use, not just flagging —
   every enumerator/school/ward that appears anywhere in the data gets a
   row here, click-to-expand for the full detail, with a shared search box
   and severity filter. All of this reads DATA.dq, which the server
   already strips to empty shapes for anyone not team-authenticated (see
   redactSummaryForPublic in src/index.js) — no extra gating needed here. */
let DQ_FILTER = '';
let DQ_SEV = 'all';
let openDqEnum = null, openDqSchool = null, openDqWard = null;

function dqMatches(...fields) {
  if (!DQ_FILTER) return true;
  const needle = DQ_FILTER.toLowerCase();
  return fields.some(f => f != null && String(f).toLowerCase().includes(needle));
}

function flagItemHtml(f) {
  return `<div class="flag-item ${f.severity === 'med' ? 'med' : ''}">
    <span class="flag-sev">${f.severity}</span>
    <div class="flag-msg">${f.message}</div>
  </div>`;
}

// A tiny hand-rolled bar sparkline (no charting library) — consistent
// with how renderTrends() already draws bars as plain styled divs rather
// than pulling in a chart dependency.
function miniSpark(days) {
  const entries = Object.entries(days || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  if (!entries.length) return '';
  const max = Math.max(...entries.map(([, v]) => v), 1);
  return `<div class="dq-spark">${entries.map(([day, v]) =>
    `<div style="height:${Math.max(3, Math.round((v / max) * 28))}px" title="${day}: ${v}"></div>`).join('')}</div>`;
}

function renderDQSummary() {
  const dq = DATA.dq;
  const nEnum = Object.keys(dq.enumerator_detail || {}).length;
  const nSchool = Object.keys(dq.school_detail || {}).length;
  const nWard = Object.keys(dq.ward_detail || {}).length;
  const totalN = Object.values(dq.enumerator_totals || {}).reduce((a, b) => a + b, 0);
  const high = dq.flags.filter(f => f.severity === 'high').length;
  const med = dq.flags.filter(f => f.severity !== 'high').length;
  document.getElementById('dq-kpis').innerHTML = `
    <div class="kc"><div class="kl">${t('kpi_dq_submissions')}</div><div class="kv">${totalN}</div></div>
    <div class="kc"><div class="kl">${t('kpi_dq_enumerators')}</div><div class="kv">${nEnum}</div></div>
    <div class="kc"><div class="kl">${t('kpi_schools')}</div><div class="kv">${nSchool}</div></div>
    <div class="kc"><div class="kl">${t('kpi_dq_wards')}</div><div class="kv">${nWard}</div></div>
    <div class="kc"><div class="kl">${t('kpi_dq_flags_high')}</div><div class="kv" style="color:var(--terracotta)">${high}</div></div>

function renderDQTimeline() {
  const days = Object.entries(DATA.dq.daily_totals || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1));
  const el = document.getElementById('dq-timeline');

  el.innerHTML = days.map(([day, v]) =>
    `<div class="dq-tbar" style="height:${Math.max(3, Math.round((v / max) * 64))}px" title="${day}: ${v}"></div>`).join('');
}

function renderDQSevPills() {
  const sevs = [['all', t('dq_sev_all')], ['high', t('dq_sev_high')], ['med', t('dq_sev_med')]];
  document.getElementById('dq-sev-pills').innerHTML = sevs.map(([k, label]) =>

function renderDQFlags() {
  let flags = DATA.dq.flags;
  if (DQ_SEV !== 'all') flags = flags.filter(f => (DQ_SEV === 'high' ? f.severity === 'high' : f.severity !== 'high'));
  if (DQ_FILTER) flags = flags.filter(f => dqMatches(f.message, f.enumerator, f.school_id));
  document.getElementById('dq-flags').innerHTML = flags.length ? flags.map(flagItemHtml).join('')
    : `<div class="empty">${DQ_FILTER ? t('dq_no_match') : t('empty_flags')}</div>`;
}

function renderDQEnumerators() {
  const pace = DATA.dq.enumerator_pace || {};
  const detail = DATA.dq.enumerator_detail || {};

    .filter(([name]) => dqMatches(name))
    .sort((a, b) => b[1] - a[1]);
  document.getElementById('dq-enum-list').innerHTML = rows.length ? rows.map(([name, n]) => {
    const p = pace[name] || {};
    const d = detail[name] || { schools: {}, days: {}, flags: [] };
    const nSchools = Object.keys(d.schools).length;
    const nFlags = d.flags.length;
    const dur = p.mean_duration != null ? `${p.mean_duration} ${LANG === 'sw' ? 'dak' : 'min'}` : '—';
    const offRoster = p.off_roster_rate != null ? `${p.off_roster_rate}%` : '—';
    let detailHtml = '';
    if (openDqEnum === name) {
      const schoolList = Object.entries(d.schools).sort((a, b) => b[1] - a[1])
        .map(([sid, c]) => `<div class="dq-mini-row"><span>${(schoolDetail[sid] || {}).name || sid}</span><span>${c}</span></div>`).join('');
      detailHtml = `<div class="school-snapshot">
        <div class="dq-mini-row"><span>${t('lbl_avg_duration')}</span><span>${dur}</span></div>
        <div class="dq-mini-row"><span>${t('lbl_off_roster_rate')}</span><span>${offRoster}</span></div>
        <div class="snap-section-label">${t('lbl_schools_visited')} (${nSchools})</div>
        <div class="dq-mini-list">${schoolList || `<div class="empty">${t('dq_empty')}</div>`}</div>
        <div class="snap-section-label">${t('lbl_days_active')} (${Object.keys(d.days).length})</div>
        ${miniSpark(d.days) || `<div class="empty">${t('dq_empty')}</div>`}

        ${nFlags ? d.flags.map(flagItemHtml).join('') : `<div class="empty">${t('dq_no_flags_entity')}</div>`}
      </div>`;
    }
    return `<div class="school-row-wrap">
      <div class="school-row dq-click-row" data-kind="enum" data-key="${name}">
        <div class="school-name">${name}<div class="school-ward">${nSchools} ${t('lbl_schools_visited').toLowerCase()} · ${n} ${t('dq_tests_short')}</div></div>
        ${nFlags ? `<span class="dq-row-flagct">${nFlags} ⚠</span>` : ''}
      </div>

function renderDQSchools() {
  const schoolDetail = DATA.dq.school_detail || {};

    .filter(([, s]) => dqMatches(s.name, s.ward))

      const enumList = Object.entries(s.by_enumerator).sort((a, b) => b[1] - a[1])

      detailHtml = `<div class="school-snapshot">
        <div class="snap-section-label">${t('lbl_by_grade')}</div>
        <div class="dq-mini-list">${gradeList || `<div class="empty">${t('dq_empty')}</div>`}</div>
        <div class="snap-section-label">${t('lbl_by_enumerator')} (${nEnum})</div>

// Delegated clicks for all three drill-down sections — one listener per
// container rather than inline onclick handlers, so enumerator/school
// names never need to be escaped into a JS string literal (they already

document.getElementById('dq-ward-list').addEventListener('click', (e) => {

function blockSpeakText(block, isPublic) {
  if (!block) return '';
  let parts = [bi(block.headline)];
  const items = isPublic ? block.what_the_data_shows : block.findings;
  if (items) parts = parts.concat(items.map(bi));
  if (isPublic && block.whats_been_done) parts.push(bi(block.whats_been_done));
  if (!isPublic && block.recommendation) parts.push(bi(block.recommendation));
  return parts.filter(Boolean).join('. ');
}

const SPEECH_SUPPORTED = 'speechSynthesis' in window;
let speakingWhich = null;

function insightBlockHtml(block, isPublic, which) {
  if (!block) return `<div class="empty">${t('insights_loading')}</div>`;
  let html = `<div class="ins-headline">${bi(block.headline)}</div>`;
  const items = isPublic ? block.what_the_data_shows : block.findings;
  if (items) {
    html += `<div class="ins-sec">${isPublic ? t('ins_what_shows') : ''}</div>`;
    items.forEach(it => { html += `<div class="ins-bullet">→ ${bi(it)}</div>`; });
  }
  if (isPublic && block.whats_been_done) {
    html += `<div class="ins-rec"><div class="ins-rec-lbl">${t('ins_whats_done')}</div>${bi(block.whats_been_done)}</div>`;
  }
  if (isPublic && block.what_schools_can_do && block.what_schools_can_do.length) {
    html += `<div class="ins-sec">${t('ins_what_next')}</div>`;
    block.what_schools_can_do.forEach(it => { html += `<div class="ins-bullet">→ ${bi(it)}</div>`; });
  }
  if (!isPublic && block.recommendation) {
    html += `<div class="ins-rec">${bi(block.recommendation)}</div>`;
  }
  if (SPEECH_SUPPORTED) {
    html += `<div style="margin-top:10px"><button class="report-btn voice-btn" data-which="${which}" onclick="speakBlock('${which}')">${speakingWhich === which ? t('voice_stop') : t('voice_listen')}</button></div>`;
  }
  return html;
}

function speakBlock(which) {
  if (!SPEECH_SUPPORTED) return;
  if (speakingWhich === which) { speechSynthesis.cancel(); speakingWhich = null; renderInsights(); return; }
  speechSynthesis.cancel();
  const block = which === 'public' ? (INSIGHTS && INSIGHTS.public) : which === 'programme' ? (INSIGHTS && INSIGHTS.programme_intelligence) : (INSIGHTS && INSIGHTS.operational_intelligence);
  const text = blockSpeakText(block, which === 'public');
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG === 'sw' ? 'sw-TZ' : 'en-US';
  // Best-effort match to an installed Swahili/English voice — not every
  // device ships one (varies by OS/skin), so this degrades to whatever
  // default voice the browser has rather than failing silently.
  const voices = speechSynthesis.getVoices();
  const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(LANG === 'sw' ? 'sw' : 'en'));
  if (match) u.voice = match;
  u.onend = () => { speakingWhich = null; renderInsights(); };
  u.onerror = () => { speakingWhich = null; renderInsights(); };
  speakingWhich = which;
  speechSynthesis.speak(u);
  document.querySelectorAll('.voice-btn').forEach(b => { b.textContent = b.dataset.which === which ? t('voice_stop') : t('voice_listen'); });
}

function renderInsights() {
  const pubEl = document.getElementById('pub-insights-card');
  const progEl = document.getElementById('prog-intel');
  const opEl = document.getElementById('op-intel');
  const btnHtml = `<button class="ins-btn" id="gen-insights-btn" onclick="triggerInsights()">${t('insights_generate')}</button>`;
  if (!INSIGHTS) {
    const msg = INSIGHTS_STALE ? t('insights_stale') : t('insights_loading');
    pubEl.innerHTML = `<div class="empty">${msg}</div><div style="text-align:center;margin-top:10px">${btnHtml}</div>`;
    progEl.innerHTML = `<div class="empty">${msg}</div>`;
    opEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  pubEl.innerHTML = insightBlockHtml(INSIGHTS.public, true, 'public') + `<div style="text-align:center;margin-top:12px">${btnHtml}</div>`;
  progEl.innerHTML = insightBlockHtml(INSIGHTS.programme_intelligence, false, 'programme');
  opEl.innerHTML = insightBlockHtml(INSIGHTS.operational_intelligence, false, 'operational');
}

async function triggerInsights() {
  // Costs real Anthropic credit per call, so it needs the team secret —
  // prompt for it rather than letting the request fail silently.
  if (!isTeamUnlocked()) { openLock(); return; }
  const btn = document.getElementById('gen-insights-btn');
  if (btn) { btn.disabled = true; btn.textContent = t('insights_generating'); }
  try {
    const res = await fetch('/api/generate-insights', { method: 'POST', headers: teamHeaders() });
    const data = await res.json();
    if (data.ok) { INSIGHTS = data.insights; INSIGHTS_STALE = false; }
  } catch (e) {}
  renderInsights();
}

/* ============================== Team access gate ==============================
   Real server-side auth now (src/index.js checks X-Team-Secret against the
   TEAM_SECRET wrangler secret) — this used to be a hardcoded client-side
   TEAM_PASSPHRASE, which protected nothing, since the "hidden" data was
   already sitting in every visitor's browser regardless of whether the UI
   showed it. The client no longer knows the correct secret at all; it just
   tries whatever was typed and asks the server whether that was right. */
const TEAM_SESSION_KEY = 'soma_team_secret';
function isTeamUnlocked() { return !!sessionStorage.getItem(TEAM_SESSION_KEY); }
function teamHeaders() {
  const s = sessionStorage.getItem(TEAM_SESSION_KEY);
  return s ? { 'X-Team-Secret': s } : {};
}
function setTeamUnlocked(v) {
  if (!v) sessionStorage.removeItem(TEAM_SESSION_KEY);
  document.getElementById('team-badge-side') && (document.getElementById('team-badge-side').textContent = v ? '🔓 Team' : '🔒 Team');
  buildNav();
  const currentTabDef = TAB_DEFS.find(d => d.key === currentTab);
  if (!v && currentTabDef && currentTabDef.team) switchTab('overview');
}
async function tryUnlock(pass) {
  if (!pass) return false;
  const btn = document.getElementById('lock-submit');
  if (btn) btn.disabled = true;
  try {
    const res = await fetchTimeout('/api/summary', { headers: { 'X-Team-Secret': pass } });
    const data = await res.json();
    if (data.team_authenticated) {
      sessionStorage.setItem(TEAM_SESSION_KEY, pass);
      setTeamUnlocked(true);
      document.getElementById('lock-overlay').hidden = true;
      document.getElementById('lock-err').textContent = '';
      load(); // re-fetch with the now-stored secret so DQ/internal data populates
      return true;
    }
  } catch (e) {}
  document.getElementById('lock-err').textContent = LANG === 'sw' ? 'Nenosiri si sahihi.' : 'Incorrect passphrase.';
  if (btn) btn.disabled = false;
  return false;
}
function openLock() {
  document.getElementById('lock-overlay').hidden = false;
  document.getElementById('lock-input').value = '';
  document.getElementById('lock-input').focus();
}
document.getElementById('team-badge-side').addEventListener('click', () => { isTeamUnlocked() ? setTeamUnlocked(false) : openLock(); });
document.getElementById('lock-submit').addEventListener('click', () => tryUnlock(document.getElementById('lock-input').value));
document.getElementById('lock-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(e.target.value); });
document.getElementById('lock-overlay').addEventListener('click', e => { if (e.target.id === 'lock-overlay') document.getElementById('lock-overlay').hidden = true; });

/* Admin export — a second, higher-privilege secret (ADMIN_KEY), separate
   from TEAM_SECRET on purpose: team access (enumerator names, DQ) and
   admin access (real children's names) are different privilege tiers —
   see reference_soma_dashboard_live_infra memory for why. The CSV comes
   back as a real HTTP response (needs the X-Admin-Key header, which a
   plain <a href> can't send), so it's fetched as a blob and handed to
   the browser as a download rather than linked directly. */
const ADMIN_SESSION_KEY = 'soma_admin_secret';
function isAdminUnlocked() { return !!sessionStorage.getItem(ADMIN_SESSION_KEY); }
function downloadChildrenCsv(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `soma-children-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
async function tryAdminUnlock(pass) {
  if (!pass) return false;
  const btn = document.getElementById('admin-lock-submit');
  if (btn) btn.disabled = true;
  try {
    const res = await fetchTimeout('/api/admin/children-export', { headers: { 'X-Admin-Key': pass } });
    if (res.ok) {
      sessionStorage.setItem(ADMIN_SESSION_KEY, pass);
      document.getElementById('admin-lock-overlay').hidden = true;
      document.getElementById('admin-lock-err').textContent = '';
      downloadChildrenCsv(await res.blob());
      if (btn) btn.disabled = false;
      return true;
    }
  } catch (e) {}
  document.getElementById('admin-lock-err').textContent = LANG === 'sw' ? 'Nenosiri si sahihi.' : 'Incorrect passphrase.';
  if (btn) btn.disabled = false;
  return false;
}
function openAdminLock() {
  document.getElementById('admin-lock-overlay').hidden = false;
  document.getElementById('admin-lock-input').value = '';
  document.getElementById('admin-lock-input').focus();
}
async function handleAdminExport() {
  if (isAdminUnlocked()) {
    try {
      const res = await fetchTimeout('/api/admin/children-export', { headers: { 'X-Admin-Key': sessionStorage.getItem(ADMIN_SESSION_KEY) } });
      if (res.ok) { downloadChildrenCsv(await res.blob()); return; }
      sessionStorage.removeItem(ADMIN_SESSION_KEY); // stored key no longer valid (e.g. reset server-side) — re-prompt below
    } catch (e) {}
  }
  openAdminLock();
}
document.getElementById('admin-lock-submit').addEventListener('click', () => tryAdminUnlock(document.getElementById('admin-lock-input').value));
document.getElementById('admin-lock-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryAdminUnlock(e.target.value); });
document.getElementById('admin-lock-overlay').addEventListener('click', e => { if (e.target.id === 'admin-lock-overlay') document.getElementById('admin-lock-overlay').hidden = true; });

let tapCount = 0, tapTimer = null;
document.getElementById('hdr-tap-zone').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 600);
  if (tapCount >= 3) { tapCount = 0; if (!isTeamUnlocked()) openLock(); }
});

/* ============================== Reports ============================== */
function openReport(kind, schoolId) {
  const yr = currentYear ? `&year=${currentYear}` : '';
  const url = kind === 'school' ? `/report.html?type=school&id=${schoolId}&lang=${LANG}${yr}` : `/report.html?type=district&lang=${LANG}${yr}`;
  window.open(url, '_blank');
}

/* ============================== Load data ============================== */
function timeAgo(iso) {
  if (!iso) return '';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return LANG === 'sw' ? 'sasa hivi' : 'just now';
  if (mins < 60) return `${mins}${LANG === 'sw' ? ' dak' : 'm'}`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}${LANG === 'sw' ? ' saa' : 'h'}`;
  return `${Math.round(hrs / 24)}${LANG === 'sw' ? ' siku' : 'd'}`;
}

// Slow/flaky mobile data is common in the field — without a timeout, a
// fetch that never resolves (rather than erroring) leaves the loading
// spinner running forever with no way out. fetchTimeout() aborts and
// throws after LOAD_TIMEOUT_MS so load() always reaches its catch block.
const LOAD_TIMEOUT_MS = 12000;
function fetchTimeout(url, opts) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), LOAD_TIMEOUT_MS);
  return fetch(url, { ...(opts || {}), signal: controller.signal }).finally(() => clearTimeout(timer));
}
function showLoadError() {
  const el = document.getElementById('page-loading');
  el.innerHTML = `<div class="loading-txt">${t('load_failed')}</div>
    <button class="report-btn" id="retry-load-btn">🔄 ${t('retry')}</button>`;
  el.hidden = false;
  document.getElementById('retry-load-btn').onclick = () => {
    el.innerHTML = `<div class="spinner"></div><div class="loading-bar"><div class="loading-bar-fill"></div></div><div class="loading-txt">${t('page_loading')}</div>`;
    load();
  };
}
// An offline-cached summary from an older deploy may lack round keys the
// current code expects (e.g. 'pilot'); fill any missing ones with empty
// buckets so a stale copy degrades to "no data" instead of throwing.
function normalizeSummary(d) {
  const blank = () => ({ reading: [0, 0, 0, 0], arithmetic: [0, 0, 0, 0], n: 0 });
  const fill = (o) => { Object.keys(ROUND_META).forEach(k => { if (!o[k]) o[k] = blank(); }); };
  Object.values(d.by_year || {}).forEach(Y => {
    fill(Y.rounds || (Y.rounds = {}));
    Object.values(Y.by_grade || {}).forEach(fill);
    Object.values(Y.schools || {}).forEach(sc => Object.values(sc.grades || {}).forEach(fill));
  });
  return d;
}
async function load() {
  applyStaticText();
  try {
    const res = await fetchTimeout('/api/summary', { headers: teamHeaders() });
    const fromCache = res.headers.get('X-Soma-Cache') === 'hit';
    DATA = normalizeSummary(await res.json());
    document.getElementById('page-loading').hidden = true;
    const badge = document.getElementById('status-badge');
    if (DATA.status === 'ok') {
      if (fromCache) {
        badge.textContent = `📴 ${t('status_offline')} · ${t('last_synced')} ${timeAgo(DATA.fetched_at)}`;
        badge.className = 'badge team';
      } else {
        badge.textContent = `${t('status_live')} · ${DATA.total_records} ${t('records')}`;
        badge.className = 'badge live';
      }
      renderAll();
    } else if (DATA.status === 'offline_no_cache') {
      badge.textContent = `📴 ${t('status_offline')}`; badge.className = 'badge team';
    } else if (DATA.status === 'pending_first_fetch') {
      badge.textContent = t('status_connecting'); badge.className = 'badge team';
    } else {
      badge.textContent = t('status_not_configured'); badge.className = 'badge team';
    }
  } catch (err) {
    document.getElementById('status-badge').textContent = t('status_error');
    showLoadError();
    return;
  }
  try {
    const res2 = await fetchTimeout('/api/insights', { headers: teamHeaders() });
    const ins = await res2.json();
    // Cached insights from an older schema version (e.g. pre-bilingual, or
    // missing fields a newer prompt introduced) get discarded rather than
    // rendered half-correctly — this is exactly how the "some insight text
    // stayed in English under Swahili" bug happened.
    if (ins && ins.public && ins.schema_version === INSIGHTS_SCHEMA_VERSION) {
      INSIGHTS = ins;
    } else if (ins && ins.public) {
      INSIGHTS = null;
      INSIGHTS_STALE = true;
    }
    renderInsights();
  } catch (e) {}
  try {
    const res3 = await fetchTimeout('/api/snapshot');
    SNAPSHOT = await res3.json();
    renderFindSchool();
    renderRecognition();
  } catch (e) {}
}
if (isTeamUnlocked()) setTeamUnlocked(true);
buildNav();
load();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
