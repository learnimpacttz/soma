<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOMA — Report</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#22262f;background:#e9ecf2}
@page{size:A4;margin:14mm}
.toolbar{position:sticky;top:0;background:#354062;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.toolbar-btn{background:#FFC650;color:#354062;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer}
.toolbar-back{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.toolbar-t{color:#fff;font-size:13px;font-weight:700}
@media print{ .toolbar-back{display:none} }
.page{max-width:800px;margin:20px auto;background:#fff;padding:28mm 16mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.rhdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #354062;padding-bottom:14px;margin-bottom:20px}
.rhdr .brand{font-size:22px;font-weight:800;color:#354062}
.rhdr .sub{font-size:11px;color:#7c869c;margin-top:2px}
.rhdr .meta{text-align:right;font-size:10px;color:#9aa4b8}
h1{font-size:18px;color:#354062;margin-bottom:4px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#354062;margin:22px 0 10px;border-bottom:1px solid #eef1f6;padding-bottom:5px}
.intro{font-size:12px;color:#4a5468;line-height:1.6;background:#F4F4F4;border-radius:8px;padding:12px 14px;margin-bottom:16px}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.kc{border:1px solid #eef1f6;border-radius:8px;padding:10px}
.kl{font-size:8.5px;text-transform:uppercase;color:#9aa4b8}
.kv{font-size:19px;font-weight:800;color:#354062}
table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:8px}
th{background:#354062;color:#fff;text-align:left;padding:6px 8px;font-size:9px;text-transform:uppercase}
td{padding:6px 8px;border-bottom:1px solid #eef1f6}
.journey{display:flex;gap:6px;margin-bottom:10px}
.jstop{flex:1;text-align:center;border:1px solid #eef1f6;border-radius:8px;padding:8px 4px}
.jpct{font-size:15px;font-weight:800;color:#354062}
.jname{font-size:8.5px;font-weight:700;margin-top:2px}
.rfoot{margin-top:26px;padding-top:12px;border-top:1px solid #eef1f6;font-size:9px;color:#b7bfd0;text-align:center}
.unlock-strip{background:#FFF9EE;border:1px dashed #d9a53d;border-radius:8px;padding:11px 14px;font-size:10.5px;color:#8a6d1f;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.unlock-btn{background:#354062;color:#fff;border:none;border-radius:6px;padding:8px 13px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
@media print{ .unlock-strip{display:none} }
.roster-note{font-size:9.5px;color:#9aa4b8;font-style:italic;margin-top:10px}
.student-chip-wrap{display:flex;flex-wrap:wrap;gap:5px}
.student-chip{font-size:9.5px;background:#eef1f6;color:#354062;border-radius:12px;padding:3px 10px;font-weight:700}
.student-chip.coded{background:#fff;border:1px dashed #d7dbe6;color:#5a6478;font-weight:600;font-style:italic}

/* ---- Teacher Action Card (2026-10-08 redesign): one short, scannable
   card per grade, built to be read in under a minute and acted on
   immediately — NOT the long aggregate-chart report this replaced. ---- */
.ht-summary{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:22px}
.ht-summary caption{text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#354062;margin-bottom:8px;caption-side:top}
.ht-summary th{background:#354062;color:#fff;padding:6px 8px;font-size:8.5px;text-transform:uppercase}
.ht-summary td{padding:6px 8px;border-bottom:1px solid #eef1f6}
.action-card{break-inside:avoid}
.ac-hdr{margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #eef1f6}
.ac-school{font-size:16px;font-weight:800;color:#354062}
.ac-sub{font-size:10.5px;color:#9aa4b8;margin-top:2px}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.subject-card{min-width:0}
.subject-title{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#354062;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #eef1f6}
.diagnosis{font-size:10px;color:#4a5468;margin-bottom:9px;font-style:italic}
.grp-block{border:1px solid #eef1f6;border-left:4px solid #354062;border-radius:7px;padding:9px 10px;margin-bottom:7px;background:#fafbfc;break-inside:avoid}
.grp-hdr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.grp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.grp-name{font-size:10.5px;font-weight:800;color:#354062;flex:1}
.grp-count{font-size:10px;font-weight:800;color:#354062;background:#eef1f6;border-radius:9px;padding:1px 7px;flex-shrink:0}
.grp-action{font-size:10px;color:#4a5468;margin-bottom:7px;line-height:1.4}
.page-break{break-before:page;page-break-before:always}
@media (max-width:600px){ .subject-grid{grid-template-columns:1fr} }
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 10px;gap:16px}
.spinner{width:36px;height:36px;border:4px solid #eef1f6;border-top-color:#5EA6B8;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:12.5px;color:#7c869c;font-weight:600}
.loading-bar{width:180px;height:5px;background:#eef1f6;border-radius:3px;overflow:hidden}
.loading-bar-fill{height:100%;width:40%;background:#5EA6B8;border-radius:3px;animation:loadbar 1.1s ease-in-out infinite}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@media print{ body{background:#fff} .toolbar{display:none} .page{box-shadow:none;margin:0;max-width:none;padding:0} }
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-left">
    <a class="toolbar-back" href="/" id="tb-back">← <span id="tb-back-label">Dashboard</span></a>
    <div class="toolbar-t" id="tb-title">SOMA Report</div>
  </div>
  <button class="toolbar-btn" onclick="window.print()" id="tb-btn" disabled style="opacity:.5;cursor:not-allowed">🖨️ Print / Save as PDF</button>
</div>
<div class="page" id="page">
  <div class="rhdr">
    <div style="display:flex;align-items:center;gap:9px"><img src="/learnimpact-mark-color.png" alt="" height="26"><div><div class="brand">SOMA</div><div class="sub" id="hsub">Kibaha Learning Progress</div></div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="meta" id="hmeta"></div>
      <img id="qr-img" width="62" height="62" alt="QR" style="border:1px solid #eef1f6;border-radius:4px">
    </div>
  </div>
  <div id="content">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div class="loading-txt" id="loading-txt">Inatengeneza ripoti…</div>
    </div>
  </div>
  <div class="rfoot"><img src="/learnimpact-mark-color.png" alt="" height="13" style="vertical-align:-2px;margin-right:5px;opacity:.85"><span id="rfoot-text">LearnImpact · SOMA Programme</span></div>
</div>
<script>
const GROUP_NAMES = {
  sw: ['Wanaoanza', 'Wanaochipukia', 'Wanaoendelea', 'Waliofikia Kiwango'],
  en: ['Starting Out', 'Emerging', 'Progressing', 'On Track'],
};
const LEVEL_COLORS = ['#BE6243', '#FFC650', '#5EA6B8', '#354062'];
// Kept identical to GUIDANCE in index.html's Teaching Guide tab — this is
// the same content printed into a physical, offline-usable handout.
const GUIDANCE = {
  reading: [
    { sw: ['Fanya mazoezi ya sauti za herufi kila siku kwa dakika 10-15', 'Tumia kadi za herufi, au uandike herufi mchangani/ubaoni', 'Unganisha sauti mbili kuwa silabi rahisi (mf. b+a=ba)'],
      en: ['Practice letter sounds daily for 10-15 minutes', 'Use letter cards, or write letters in sand/on the board', 'Blend two sounds into a simple syllable (e.g. b+a=ba)'] },
    { sw: ['Soma silabi kwa sauti kubwa kila siku', 'Unganisha silabi mbili kuwa neno rahisi (mf. ba+ba=baba)', 'Cheza mchezo wa kupanga kadi za silabi kuwa maneno'],
      en: ['Read syllables aloud every day', 'Combine two syllables into a simple word (e.g. ba+ba=baba)', 'Play a card game arranging syllables into words'] },
    { sw: ['Soma orodha ya maneno kwa ufasaha kila siku', 'Soma sentensi fupi pamoja na mwenzake (jozi)', 'Eleza maana ya sentensi kwa maneno yake mwenyewe'],
      en: ['Read a word list fluently every day', 'Read short sentences in pairs with a classmate', "Explain a sentence's meaning in their own words"] },
    { sw: ['Soma aya na ujibu maswali ya ufahamu', 'Soma kwa sauti mbele ya darasa au kikundi', 'Mpe kazi ya ziada: kusoma hadithi fupi kwa kujitegemea'],
      en: ['Read a paragraph and answer comprehension questions', 'Read aloud to the class or a small group', 'Give extension work: reading a short story independently'] },
  ],
  arithmetic: [
    { sw: ['Hesabu vitu halisi kila siku (mawe, maharage, vidole)', 'Tambua namba 1-9 kwa kadi au kwenye ubao'],
      en: ['Count real objects daily (stones, beans, fingers)', 'Recognize numbers 1-9 using cards or the board'] },
    { sw: ['Tambua namba 1-99, panga kwa mpangilio', 'Linganisha namba mbili — ipi kubwa, ipi ndogo'],
      en: ['Recognize numbers 1-99, arrange them in order', 'Compare two numbers — which is bigger, which is smaller'] },
    { sw: ['Fanya mazoezi ya kujumlisha kila siku, kuanzia vitu halisi kisha namba', 'Tatua maswali rahisi ya mafumbo yanayohusu kujumlisha'],
      en: ['Practice addition daily, starting with real objects then numbers', 'Solve simple word problems involving addition'] },
    { sw: ['Fanya mazoezi ya kutoa, ikiwemo kukopa namba', 'Changanya kujumlisha na kutoa kwenye maswali ya mafumbo'],
      en: ['Practice subtraction, including borrowing', 'Combine addition and subtraction in word problems'] },
  ],
};
const ROUND_META = {
  pilot: { number: null, technical: { sw: 'Pilot', en: 'Pilot' }, shortTechnical: { sw: 'Pilot', en: 'Pilot' } },
  round1: { number: 1, technical: { sw: 'Msingi', en: 'Baseline' }, shortTechnical: { sw: 'MS', en: 'BL' } },
  round2: { number: 2, technical: { sw: 'Katikati', en: 'Midline' }, shortTechnical: { sw: 'KT', en: 'ML' } },
  round3: { number: 3, technical: { sw: 'Mwisho', en: 'Endline' }, shortTechnical: { sw: 'MW', en: 'EL' } },
};
const qs = new URLSearchParams(location.search);
const LANG = qs.get('lang') === 'en' ? 'en' : 'sw';
const TYPE = ['school', 'batch'].includes(qs.get('type')) ? qs.get('type') : 'district';
const SCHOOL_ID = qs.get('id');
const YEAR_PARAM = qs.get('year');
// Batch mode: scope=district (every school) or scope=ward&ward=<name> —
// same short action-card format as a single school, repeated with a
// page break between each, so one Print/Save-as-PDF produces one file
// covering a whole ward or the whole district at once.
const BATCH_SCOPE = qs.get('scope') === 'ward' ? 'ward' : 'district';
const BATCH_WARD = qs.get('ward');

function roundsForYear(year) {
  // Everything in 2026 is the Pilot; Visit #1/#2/#3 numbering starts in 2027.
  return year === '2026' ? ['pilot'] : ['round1', 'round2', 'round3'];
}
function roundTop(key) {
  const m = ROUND_META[key];
  if (key === 'pilot') return m.technical[LANG];
  return LANG === 'sw' ? `Ziara #${m.number}` : `Visit #${m.number}`;
}
// Msingi/Katikati/Mwisho is ambiguous in Swahili, so it only appears in
// English — Swahili shows "Ziara #N" alone.
function roundLabel(key) {
  const m = ROUND_META[key];
  return LANG === 'en' && key !== 'pilot' ? `${roundTop(key)} (${m.technical.en})` : roundTop(key);
}
function bestAvailableRound(rounds, year) {
  const seq = roundsForYear(year);
  for (let i = seq.length - 1; i >= 0; i--) if (rounds[seq[i]] && rounds[seq[i]].n > 0) return seq[i];
  return seq[0];
}

const STR = LANG === 'en' ? {
  title_school: 'School Report', title_district: 'District Report',
  generated: 'Generated', round: 'Visit', students: 'Students Assessed',
  reading: 'Reading', arithmetic: 'Arithmetic', grade: 'Grade',
  school_table: 'How Schools Compare', school_col: 'School', ward_col: 'Ward', n_col: 'n',
  skill_breakdown: 'Skill Breakdown', now: 'Latest', change: 'Change',
  footer: 'LearnImpact · SOMA Programme · Kibaha District & Municipal Councils',
  no_data: 'No data available yet.', trend: 'Trend', back: 'Dashboard',
  loading: 'Generating your report…',
  roster_note: "Off-roster students are shown by name. Roster students are shown by their assessment code — match it against your school's own class roster to find the name.",
  unlock_cta: '🔐 Add Student Names & Ability (Admin)',
  unlock_msg: 'This report can include every student by name/code and ability group — add the Admin passphrase to load it.',
  unlock_prompt: 'Enter the Admin passphrase to load student names & ability:',
  unlock_wrong: 'Incorrect passphrase.', unlock_err: 'Network error — try again.',
  students_count: 'students', title_batch: 'Batch School Reports',
  ht_summary: 'For the Headteacher — School Summary', on_track: 'On Track',
  largest_group: (n, total, name) => `Largest group: <b>${name}</b> (${n} of ${total} students).`,
  batch_label: (ward) => ward ? `Ward: ${ward}` : 'Whole District',
} : {
  title_school: 'Ripoti ya Shule', title_district: 'Ripoti ya Wilaya',
  generated: 'Imetengenezwa', round: 'Ziara', students: 'Watoto Waliopimwa',
  reading: 'Usomaji', arithmetic: 'Hesabu', grade: 'Darasa',
  school_table: 'Ulinganisho wa Shule', school_col: 'Shule', ward_col: 'Kata', n_col: 'idadi',
  skill_breakdown: 'Ustadi kwa Kina', now: 'Sasa', change: 'Mabadiliko',
  footer: 'LearnImpact · Programu ya SOMA · Halmashauri ya Wilaya na Manispaa ya Kibaha',
  no_data: 'Hakuna takwimu bado.', trend: 'Mwenendo', back: 'Dashibodi',
  loading: 'Inatengeneza ripoti yako…',
  roster_note: 'Wanafunzi walio nje ya orodha wanaonyeshwa kwa majina yao. Wanafunzi walio katika orodha ya shule wanaonyeshwa kwa namba yao ya tathmini — linganisha na orodha ya shule yako kupata jina.',
  unlock_cta: '🔐 Ongeza Majina na Uwezo wa Wanafunzi (Admin)',
  unlock_msg: 'Ripoti hii inaweza kuonyesha kila mwanafunzi kwa jina/namba na kundi lake la uwezo — weka nenosiri la Admin kuipakia.',
  unlock_prompt: 'Weka nenosiri la Admin kupakia majina na uwezo wa wanafunzi:',
  unlock_wrong: 'Nenosiri si sahihi.', unlock_err: 'Hitilafu ya mtandao — jaribu tena.',
  students_count: 'wanafunzi', title_batch: 'Ripoti za Shule kwa Kundi',
  ht_summary: 'Kwa Mwalimu Mkuu — Muhtasari wa Shule', on_track: 'Waliofikia Kiwango',
  largest_group: (n, total, name) => `Kundi kubwa zaidi: <b>${name}</b> (wanafunzi ${n} kati ya ${total}).`,
  batch_label: (ward) => ward ? `Kata: ${ward}` : 'Wilaya Nzima',
};

function pct(c, n) { return n > 0 ? Math.round((c / n) * 100) : 0; }
function journeyHtml(bucket) {
  if (!bucket || !bucket.n) return `<div style="font-size:11px;color:#9aa4b8">${STR.no_data}</div>`;
  let h = '<div class="journey">';
  for (let i = 0; i < 4; i++) {
    h += `<div class="jstop"><div class="jpct" style="color:${LEVEL_COLORS[i]}">${pct(bucket[i], bucket.n)}%</div><div class="jname">${GROUP_NAMES[LANG][i]}</div></div>`;
  }
  return h + '</div>';
}

/* ============================== Student-level detail (Admin-gated) ==============================
   Real names only ever exist here for off-roster children (see
   src/children.js) — roster children only ever carry their assessment
   code, by design, since the KoBo form never transmits a roster child's
   name. Gated by ADMIN_KEY, one tier above the dashboard's TEAM_SECRET,
   because this is the one place in the whole system a real child's name
   can appear on screen. sessionStorage key matches index.html's exactly,
   so unlocking Admin on the dashboard once covers this page too, same
   origin, same browser session — no separate unlock needed in that case. */
const ADMIN_SESSION_KEY = 'soma_admin_secret';
async function fetchSchoolRoster(schoolId, adminKey) {
  const res = await fetch(`/api/admin/school-roster?school_id=${encodeURIComponent(schoolId)}`, { headers: { 'X-Admin-Key': adminKey } });
  if (!res.ok) return { ok: false, status: res.status };
  const d = await res.json();
  return { ok: !!d.ok, students: d.students || [] };
}
async function tryFetchRosterSilently(schoolId) {
  const key = sessionStorage.getItem(ADMIN_SESSION_KEY);
  if (!key) return null;
  try {
    const r = await fetchSchoolRoster(schoolId, key);
    if (!r.ok) { sessionStorage.removeItem(ADMIN_SESSION_KEY); return null; }
    return r.students;
  } catch (e) { return null; }
}
async function unlockAndRebuild() {
  const pass = window.prompt(STR.unlock_prompt);
  if (!pass) return;
  try {
    const r = await fetchSchoolRoster(SCHOOL_ID, pass);
    if (!r.ok) { alert(STR.unlock_wrong); return; }
    sessionStorage.setItem(ADMIN_SESSION_KEY, pass);
    build();
  } catch (e) { alert(STR.unlock_err); }
}
// Batch mode verifies against whichever school happens to be first in
// scope — same idea as unlockAndRebuild, just not tied to one fixed
// SCHOOL_ID since a batch covers many schools.
async function unlockAndRebuildBatch(testSchoolId) {
  const pass = window.prompt(STR.unlock_prompt);
  if (!pass) return;
  try {
    if (testSchoolId) {
      const r = await fetchSchoolRoster(testSchoolId, pass);
      if (!r.ok) { alert(STR.unlock_wrong); return; }
    }
    sessionStorage.setItem(ADMIN_SESSION_KEY, pass);
    build();
  } catch (e) { alert(STR.unlock_err); }
}
function studentLabel(s) {
  if (s.name) return `<span class="student-chip">${s.name}</span>`;
  return `<span class="student-chip coded">${s.id}</span>`;
}

/* ============================== Teacher Action Card ==============================
   Replaces the old per-grade stack of journey-%-chart + trend table +
   duplicated "what to do" bullets + movement table + a second copy of
   the same guidance inside student detail — Michael's own read was that
   it was "way too long and not instinctive." This is the entire
   redesign: ONE short card per grade, ONE instruction per ability group
   (the single highest-leverage action, not a 3-item lesson plan), the
   class list for that group right under it, nothing else. Aggregate
   charts/trends move to the headteacher summary table and the district
   report — a classroom teacher deciding what to do tomorrow doesn't
   need a percentage trend line. */
function groupBlockHtml(groupStudents, level, subject) {
  if (!groupStudents.length) return '';
  return `<div class="grp-block" style="border-left-color:${LEVEL_COLORS[level]}">
    <div class="grp-hdr">
      <span class="grp-dot" style="background:${LEVEL_COLORS[level]}"></span>
      <span class="grp-name">${GROUP_NAMES[LANG][level]}</span>
      <span class="grp-count">${groupStudents.length}</span>
    </div>
    <div class="grp-action">${GUIDANCE[subject][level][LANG][0]}</div>
    <div class="student-chip-wrap">${groupStudents.map(studentLabel).join('')}</div>
  </div>`;
}
// Reading and arithmetic are grouped separately — a child's reading and
// arithmetic ability commonly differ, and TaRL-style grouped teaching
// runs each subject as its own rotation, not one combined group.
function subjectCardHtml(students, grade, subject) {
  const levelKey = subject === 'reading' ? 'reading_level' : 'arithmetic_level';
  const gradeStudents = students.filter(s => String(s.grade) === String(grade) && Number.isInteger(s[levelKey]));
  if (!gradeStudents.length) return '';
  const groups = [[], [], [], []];
  gradeStudents.forEach(s => { const lvl = s[levelKey]; if (lvl >= 0 && lvl <= 3) groups[lvl].push(s); });
  const ranked = groups.map((g, i) => ({ i, n: g.length })).sort((a, b) => b.n - a.n)[0];
  const diagnosis = ranked && ranked.n ? STR.largest_group(ranked.n, gradeStudents.length, GROUP_NAMES[LANG][ranked.i]) : '';
  let html = `<div class="subject-card"><div class="subject-title">${STR[subject]}</div>`;
  if (diagnosis) html += `<div class="diagnosis">${diagnosis}</div>`;
  for (let i = 0; i < 4; i++) html += groupBlockHtml(groups[i], i, subject);
  html += '</div>';
  return html;
}
function actionCardHtml(schoolName, ward, grade, n, students) {
  return `<div class="action-card">
    <div class="ac-hdr">
      <div class="ac-school">${schoolName}</div>
      <div class="ac-sub">${ward ? ward + ' · ' : ''}${STR.grade} ${grade} · ${n} ${STR.students_count}</div>
    </div>
    <div class="subject-grid">${subjectCardHtml(students, grade, 'reading')}${subjectCardHtml(students, grade, 'arithmetic')}</div>
    <div class="roster-note">${STR.roster_note}</div>
  </div>`;
}
// One small table, not a chart per grade — leadership/headteacher context
// belongs in a single glance, not interleaved with the teacher's action
// cards further down.
function headteacherSummaryHtml(s, year) {
  const grades = Object.keys(s.grades).sort();
  let rows = '';
  grades.forEach(g => {
    const round = bestAvailableRound(s.grades[g], year);
    const rs = s.grades[g][round];
    if (!rs || !rs.n) return;
    rows += `<tr><td>${STR.grade} ${g}</td><td>${rs.n}</td><td>${pct(rs.reading[3], rs.n)}%</td><td>${pct(rs.arithmetic[3], rs.n)}%</td></tr>`;
  });
  if (!rows) return '';
  return `<table class="ht-summary"><caption>${STR.ht_summary}</caption>
    <tr><th>${STR.grade}</th><th>${STR.students}</th><th>${STR.reading} — ${STR.on_track}</th><th>${STR.arithmetic} — ${STR.on_track}</th></tr>
    ${rows}</table>`;
}
function unlockStripHtml(onclickFn) {
  return `<div class="unlock-strip"><span>${STR.unlock_msg}</span><button class="unlock-btn" onclick="${onclickFn}">${STR.unlock_cta}</button></div>`;
}

async function build() {
  document.documentElement.lang = LANG;
  document.getElementById('tb-back-label').textContent = STR.back;
  document.getElementById('tb-back').href = `/?lang=${LANG}`;
  // Guarded: build() can run a second time after unlockAndRebuild()
  // succeeds, by which point #content's original loading markup
  // (including this element) has already been replaced.
  const loadingTxt = document.getElementById('loading-txt');
  if (loadingTxt) loadingTxt.textContent = STR.loading;
  const res = await fetch('/api/summary');
  const d = await res.json();
  const now = new Date().toLocaleDateString(LANG === 'sw' ? 'sw-TZ' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('hmeta').innerHTML = `${STR.generated}: ${now}<br><span style="font-size:8.5px">${LANG === 'sw' ? 'Changanua kwa dashibodi hai' : 'Scan for live dashboard'}</span>`;
  const dashboardUrl = `${location.origin}/?lang=${LANG}`;
  document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodeURIComponent(dashboardUrl)}`;

  const years = d.years || [];
  const year = years.includes(YEAR_PARAM) ? YEAR_PARAM : years[years.length - 1];
  if (!year) { document.getElementById('content').innerHTML = `<div>${STR.no_data}</div>`; return; }
  const Y = d.by_year[year];

  if (TYPE === 'school') {
    const s = Y.schools[SCHOOL_ID];
    document.getElementById('tb-title').textContent = STR.title_school;
    document.getElementById('hsub').textContent = `${STR.title_school} — ${year}`;
    if (!s) { document.getElementById('content').innerHTML = `<div>${STR.no_data}</div>`; return; }
    const rosterStudents = await tryFetchRosterSilently(SCHOOL_ID);
    let html = `<h1>${s.name}</h1><div style="font-size:11px;color:#9aa4b8;margin-bottom:14px">${s.ward || ''} · ${year}</div>`;
    if (!rosterStudents) html += unlockStripHtml('unlockAndRebuild()');
    html += headteacherSummaryHtml(s, year);
    const grades = Object.keys(s.grades).sort();
    grades.forEach((g, i) => {
      const round = bestAvailableRound(s.grades[g], year);
      const n = s.grades[g][round].n;
      if (!n) return;
      html += `<div class="${i === 0 ? '' : 'page-break'}">${actionCardHtml(s.name, s.ward, g, n, rosterStudents || [])}</div>`;
    });
    document.getElementById('content').innerHTML = html;
  } else if (TYPE === 'batch') {
    document.getElementById('tb-title').textContent = STR.title_batch;
    const scopeLabel = STR.batch_label(BATCH_SCOPE === 'ward' ? BATCH_WARD : null);
    document.getElementById('hsub').textContent = `${STR.title_batch} — ${scopeLabel} — ${year}`;
    let schools = Object.entries(Y.schools);
    if (BATCH_SCOPE === 'ward' && BATCH_WARD) schools = schools.filter(([, s]) => s.ward === BATCH_WARD);
    schools.sort((a, b) => (a[1].ward || '').localeCompare(b[1].ward || '') || a[1].name.localeCompare(b[1].name));
    if (!schools.length) { document.getElementById('content').innerHTML = `<div>${STR.no_data}</div>`; return; }

    let adminKey = sessionStorage.getItem(ADMIN_SESSION_KEY);
    let html = `<h1>${STR.title_batch}</h1><div style="font-size:11px;color:#9aa4b8;margin-bottom:14px">${scopeLabel} · ${schools.length} ${LANG === 'sw' ? 'shule' : 'schools'} · ${year}</div>`;
    if (!adminKey) html += unlockStripHtml(`unlockAndRebuildBatch('${schools[0][0]}')`);

    // Fetch every school's roster in parallel rather than one at a time —
    // a 10-school district batch would otherwise serialize 10 round
    // trips before anything renders.
    const rosterMap = {};
    if (adminKey) {
      await Promise.all(schools.map(async ([schoolId]) => {
        const r = await fetchSchoolRoster(schoolId, adminKey);
        rosterMap[schoolId] = r.ok ? r.students : [];
      }));
    }

    // Every grade gets its OWN page, same as single-school mode — the
    // whole point of a batch PDF is that the ops team can split it back
    // into individual take-away sheets per teacher, and each action card
    // already prints its own school/ward/grade header, so pages are
    // self-identifying once split apart.
    let isFirstPage = true;
    schools.forEach(([schoolId, s]) => {
      const grades = Object.keys(s.grades).sort().filter((g) => {
        const r = bestAvailableRound(s.grades[g], year);
        return s.grades[g][r] && s.grades[g][r].n;
      });
      if (!grades.length) return;
      html += `<div class="${isFirstPage ? '' : 'page-break'}">${headteacherSummaryHtml(s, year)}</div>`;
      isFirstPage = false;
      grades.forEach((g) => {
        const round = bestAvailableRound(s.grades[g], year);
        const n = s.grades[g][round].n;
        html += `<div class="page-break">${actionCardHtml(s.name, s.ward, g, n, rosterMap[schoolId] || [])}</div>`;
      });
    });
    document.getElementById('content').innerHTML = html;
  } else {
    document.getElementById('tb-title').textContent = STR.title_district;
    document.getElementById('hsub').textContent = `${STR.title_district} — ${year}`;
    const round = bestAvailableRound(Y.rounds, year);
    let html = `<h1>${STR.title_district}</h1>`;
    html += `<div class="kg">
      <div class="kc"><div class="kl">${STR.students}</div><div class="kv">${Y.rounds[round].n}</div></div>
      <div class="kc"><div class="kl">${STR.round}</div><div class="kv" style="font-size:12px">${roundLabel(round)}</div></div>
      <div class="kc"><div class="kl">${STR.reading}</div><div class="kv">${pct(Y.rounds[round].reading[3], Y.rounds[round].n)}%</div></div>
      <div class="kc"><div class="kl">${STR.arithmetic}</div><div class="kv">${pct(Y.rounds[round].arithmetic[3], Y.rounds[round].n)}%</div></div>
    </div>`;
    html += `<h2>${STR.reading}</h2>${journeyHtml(Y.rounds[round].reading.reduce((o, v, i) => (o[i] = v, o), { n: Y.rounds[round].n }))}`;
    html += `<h2>${STR.arithmetic}</h2>${journeyHtml(Y.rounds[round].arithmetic.reduce((o, v, i) => (o[i] = v, o), { n: Y.rounds[round].n }))}`;
    html += `<h2>${STR.school_table}</h2><table><tr><th>${STR.school_col}</th><th>${STR.ward_col}</th><th>${STR.n_col}</th><th>${STR.reading}</th><th>${STR.arithmetic}</th></tr>`;
    Object.values(Y.schools).forEach(s => {
      let n = 0, r3 = 0, a3 = 0;
      Object.values(s.grades).forEach(g => { if (g[round]) { n += g[round].n; r3 += g[round].reading[3]; a3 += g[round].arithmetic[3]; } });
      if (n) html += `<tr><td>${s.name}</td><td>${s.ward || ''}</td><td>${n}</td><td>${pct(r3, n)}%</td><td>${pct(a3, n)}%</td></tr>`;
    });
    html += '</table>';
    document.getElementById('content').innerHTML = html;
  }
  document.getElementById('rfoot-text').textContent = STR.footer;
  const btn = document.getElementById('tb-btn');
  btn.disabled = false;
  btn.style.opacity = '1';
  btn.style.cursor = 'pointer';
}
build();
</script>
</body>
</html>
